[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phm-data-factory"
version = "0.2.0"
description = "Agent-ready PHM data access layer with Apache IoTDB as the runtime backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "PHMbench" }]
dependencies = ["numpy>=1.20", "pandas>=1.3", "apache-iotdb>=2.0.8,<3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
legacy = ["h5py>=3.7", "openpyxl>=3.0", "xlrd>=2.0"]
yaml = ["PyYAML>=6.0"]
agent = ["mcp[cli]>=1.27,<2"]
dev = ["pytest>=7", "PyYAML>=6", "h5py>=3.7", "openpyxl>=3", "xlrd>=2.0"]
all = ["h5py>=3.7", "openpyxl>=3", "xlrd>=2.0", "PyYAML>=6", "mcp[cli]>=1.27,<2"]

[project.scripts]
phm-data = "phm_data_factory.cli:main"
phm-data-mcp = "phm_data_factory.mcp_server:main"
phm-data-iotdb = "phm_data_factory.iotdb:main"

[project.urls]
Repository = "https://github.com/PHMbench/PHM-Vibench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phm_data_factory = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
